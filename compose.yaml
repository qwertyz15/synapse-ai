services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-agent_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    # Only the web UI is meant to be reached from outside; the API stays on this machine.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    # Docker keeps chats, the app database and long-term memory in the postgres service.
    environment:
      - HOST=0.0.0.0
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env}
      - DATABASE_TYPE=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-agent_service}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Volume mount of development-only credentials since compose watch doesn't sync ignored files and doesn't do initial sync when the service starts
    volumes:
      - ./privatecredentials:/privatecredentials
      # RAG documents and index, shared with local runs and kept across rebuilds
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    develop:
      watch:
        - path: src/agents/
          action: sync+restart
          target: /app/agents/
        - path: src/schema/
          action: sync+restart
          target: /app/schema/
        - path: src/service/
          action: sync+restart
          target: /app/service/
        - path: src/core/
          action: sync+restart
          target: /app/core/
        - path: src/db/
          action: sync+restart
          target: /app/db/
        - path: src/ingestion/
          action: sync+restart
          target: /app/ingestion/
        - path: src/memory/
          action: sync+restart
          target: /app/memory/
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    depends_on:
      - agent_service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - AGENT_URL=http://agent_service:8080
      - AUTH_SECRET=${AUTH_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_APP_SLUG=${GITHUB_APP_SLUG:-}
      - WEB_SESSION_SECRET=${WEB_SESSION_SECRET:-}
      - RATE_LIMIT_CHATS_PER_HOUR=${RATE_LIMIT_CHATS_PER_HOUR:-}
      - RATE_LIMIT_CHATS_PER_MINUTE_GLOBAL=${RATE_LIMIT_CHATS_PER_MINUTE_GLOBAL:-}
      - RATE_LIMIT_UPLOADS_PER_HOUR=${RATE_LIMIT_UPLOADS_PER_HOUR:-}
    develop:
      watch:
        - path: frontend/
          action: rebuild
          ignore:
            - node_modules/
            - .next/

  streamlit_app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - agent_service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - AGENT_URL=http://agent_service:8080
    develop:
      watch:
        - path: src/client/
          action: sync+restart
          target: /app/client/
        - path: src/schema/
          action: sync+restart
          target: /app/schema/
        - path: src/streamlit_app.py
          action: sync+restart
          target: /app/streamlit_app.py
        - path: src/pages/
          action: sync+restart
          target: /app/pages/

volumes:
  postgres_data:
